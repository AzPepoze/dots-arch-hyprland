# See Window Rules Documentation provided

#-------------------------------------------------------
# [Idle Inhibit]
#-------------------------------------------------------
# Syntax: windowrule = match:PROP REGEX, EFFECT ARG
windowrule = match:class ^((.*[Cc]elluloid.*)|(.*[Mm]pv.*)|(.*[Vv]lc.*)|(.*[Ss]potify.*)|(.*[Ll]ibre[Ww]olf.*)|(.*[Ff]loorp.*)|(.*[Bb]rave.*)|(.*[Ff]irefox.*)|(.*[Cc]hromium.*)|(.*[Zz]en.*)|(.*[Vv]ivaldi.*))$, idle_inhibit fullscreen

#-------------------------------------------------------
# [Opacity Rules]
#-------------------------------------------------------
windowrule = match:class ^(kitty)$, opacity 0.80 0.80 1
windowrule = match:class ^(org.kde.dolphin)$, opacity 0.80 0.80 1
windowrule = match:class ^(com.github.th_ch.youtube_music)$, opacity 0.90 0.85

#-------------------------------------------------------
# [Floating Windows]
#-------------------------------------------------------
# System & Toolkits
windowrule = match:class ^(hyprland-share-picker)$, float on
windowrule = match:class ^(nwg-look)$, float on
windowrule = match:class ^((qt5ct)|(qt6ct))$, float on
windowrule = match:class ^(kvantummanager)$, float on
windowrule = match:class ^(org.pulseaudio.pavucontrol)$, float on
windowrule = match:class ^(blueman-manager)$, float on
windowrule = match:class ^((nm-applet)|(nm-connection-editor))$, float on
windowrule = match:class ^(org.kde.polkit-kde-authentication-agent-1)$, float on

# Common Dialogs
windowrule = match:title ^((Open|Save As|Choose|Select|View) (File|Files|Folder|Directory|Image|Wallpaper).*)$, float on
windowrule = match:title ^(Authentication Required)$, float on
windowrule = match:title ^(Add Folder to Workspace)$, float on
windowrule = match:title ^(Confirm to replace files)$, float on
windowrule = match:title ^(File Operation Progress)$, float on
windowrule = match:title ^(Progress Dialog)$, float on
windowrule = match:title ^(Library)$, float on
windowrule = match:title ^(About .*)$, float on
windowrule = match:class ^([Xx]dg-desktop-portal-.*)$, float on
# Combined match (Using match:class AND match:title in one line)
windowrule = match:class ^(.*dialog.*)$, match:title ^(.*dialog.*)$, float on

# Applications
windowrule = match:class ^(org.kde.ark)$, float on
windowrule = match:class ^(vlc)$, float on
windowrule = match:class ^(Signal)$, float on
windowrule = match:class ^(com.github.rafostar.Clapper)$, float on
windowrule = match:class ^(app.drey.Warp)$, float on
windowrule = match:class ^(net.davidotek.pupgui2)$, float on
windowrule = match:class ^(yad)$, float on
windowrule = match:class ^(eog)$, float on
windowrule = match:class ^(io.github.alainm23.planify)$, float on
windowrule = match:class ^(io.gitlab.theevilskeleton.Upscaler)$, float on
windowrule = match:class ^(com.github.unrud.VideoDownloader)$, float on
windowrule = match:class ^(io.gitlab.adhami3310.Impression)$, float on
windowrule = match:class ^(io.missioncenter.MissionCenter)$, float on

# Complex matches (Class AND Title)
windowrule = match:class ^(kitty)$, match:title ^((top)|(btop)|(htop))$, float on
windowrule = match:class ^(firefox)$, match:title ^((Picture-in-Picture)|(Library))$, float on

#-------------------------------------------------------
# [Tile Windows Rules]
#-------------------------------------------------------
windowrule = match:class ^(Godot)$, tile on

#-------------------------------------------------------
# [Picture-in-Picture]
#-------------------------------------------------------
# Note: Using explicit on/off and expressions
windowrule = match:title ^([Pp]icture-in-[Pp]icture)$, float on
windowrule = match:title ^([Pp]icture-in-[Pp]icture)$, keep_aspect_ratio on
windowrule = match:title ^([Pp]icture-in-[Pp]icture)$, move 73% 72%
# Size needs two arguments [expr] [expr]
windowrule = match:title ^([Pp]icture-in-[Pp]icture)$, size 25% 25%
windowrule = match:title ^([Pp]icture-in-[Pp]icture)$, pin on

#-------------------------------------------------------
# [Application Specific Rules]
#-------------------------------------------------------
# Line
windowrule = match:initial_title ^(ophjlpahpchlmihnnnihgmmeilfjmjjc_/index.html)$, tile on

# Microsoft Edge Messenger
windowrule = match:class ^(Microsoft-edge-dev)$, match:title ^(Messenger)$, tile on

#-------------------------------------------------------
# [Layer Rules]
#-------------------------------------------------------
windowrule = match:class .*, no_blur off

layerrule = match:namespace rofi, blur on
layerrule = match:namespace rofi, xray off
layerrule = match:namespace rofi, ignore_alpha 0.0

layerrule = match:namespace notifications, blur on
layerrule = match:namespace notifications, ignore_alpha 0.0

layerrule = match:namespace swaync-notification-window, blur on
layerrule = match:namespace swaync-notification-window, ignore_alpha 0.0

layerrule = match:namespace swaync-control-center, blur on
layerrule = match:namespace swaync-control-center, ignore_alpha 0.0

layerrule = match:namespace logout_dialog, blur on
layerrule = match:namespace cava, blur on

# Quickshell
layerrule = match:namespace quickshell:.*, blur on
layerrule = match:namespace quickshell:.*, xray off
layerrule = match:namespace quickshell:.*, ignore_alpha 0.7

layerrule = match:namespace quickshell:dock, ignore_alpha 0.0
layerrule = match:namespace quickshell:bar, ignore_alpha 0.0
layerrule = match:namespace quickshell:sidebar(Left|Right), ignore_alpha 0.15
layerrule = match:namespace quickshell:notificationPopup, ignore_alpha 0.5

# Ulauncher
windowrule = match:class ^([Uu]launcher)$, stay_focused on
windowrule = match:class ^([Uu]launcher)$, border_size 0
windowrule = match:class ^([Uu]launcher)$, no_blur on
windowrule = match:class ^([Uu]launcher)$, no_shadow on
windowrule = match:class ^([Uu]launcher)$, animation gnomed