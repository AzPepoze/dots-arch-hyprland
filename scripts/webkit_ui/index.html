<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Az Arch Hyprland Installer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>
                <!-- Simple SVG Logo -->
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="#cba6f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2 17L12 22L22 17" stroke="#cba6f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2 12L12 17L22 12" stroke="#cba6f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                Az Arch Installer
            </h1>
            <div class="header-meta">
                <p>Select components to customize your setup</p>
            </div>
        </header>

        <div class="controls">
            <button onclick="pySelectEssentialPC()">Select Essentials (PC)</button>
            <button onclick="pySelectEssentialLaptop()">Select Essentials (Laptop)</button>
            <button onclick="pySelectAll()">Select All</button>
            <button onclick="pyDeselectAll()">Deselect All</button>
        </div>

        <div class="workspace">
            <div class="main-area">
                <div class="tabs" id="tabs-container">
                    <!-- Tabs injected by JS -->
                </div>

                <div class="tab-content" id="tab-content-container">
                    <!-- Content injected by JS -->
                </div>
            </div>

            <!-- Resizer Handle -->
            <div class="resizer" id="dragMe"></div>

            <div class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <h3>Execution Order</h3>
                    <span id="selected-count" class="badge">0</span>
                </div>
                <div class="execution-list" id="execution-list-container">
                    <!-- List injected by JS -->
                </div>
            </div>
        </div>

        <footer>
            <button id="run-btn" onclick="pyRunInstallation()">START INSTALLATION</button>
        </footer>
    </div>
    <script src="app.js"></script>
</body>
</html>
